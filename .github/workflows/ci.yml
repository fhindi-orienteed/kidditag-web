name: Web CI/CD Pipeline

on:
  push:
    branches: [ maram, main ]
  pull_request:
    branches: [ maram, main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Vite Build Check
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run / Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: kidditag-web:latest
